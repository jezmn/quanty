name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, quanty]
    environment: production

    env:
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          docker compose down
          docker compose up -d --build

      - name: Cleanup
        run: docker image prune -f
